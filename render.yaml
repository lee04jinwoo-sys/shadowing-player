services:
  - type: web
    name: shadowing-player
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python -c 'from backend.anki_core.pos import setup_nltk; setup_nltk()'"
    startCommand: "uvicorn server:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GOOGLE_API_KEY
        sync: false
