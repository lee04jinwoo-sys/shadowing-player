<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Shadowing Player</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<link href="/css/styles.css?v=20260816_2051" rel="stylesheet">
</head>
<body>

<!-- ============ Header ============ -->
<header>
  <div class="logo-section">
    <h1>Shadowing Player</h1>
  </div>

  <div class="header-center-controls">
    <!-- Source Toggle -->
    <div id="source-toggle">
      <button class="source-toggle-btn active" id="source-local-btn" title="로컬 영상">
        <span class="material-symbols-outlined">folder</span>로컬
      </button>
      <button class="source-toggle-btn" id="source-youtube-btn" title="유튜브 영상">
        <span class="material-symbols-outlined">play_circle</span>YouTube
      </button>
    </div>

    <!-- Media Controls Fixed Slot -->
    <div id="media-slot">
      <!-- Local: Episode Selector -->
      <div id="local-controls">
        <select id="episode-select">
          <option value="">에피소드 불러오는 중...</option>
        </select>
        <button class="header-btn" id="subtitle-search-btn" style="display: none;" title="온라인에서 자막을 자동으로 검색하여 다운로드합니다">🔍 온라인 자막 검색</button>
        <button class="header-btn" id="episode-complete-btn" style="display: none;" title="이 에피소드를 완료 처리합니다">✅ 완료 표시</button>
      </div>

      <!-- YouTube: URL Input & History -->
      <div id="youtube-controls">
        <input id="youtube-url-input" type="text" placeholder="유튜브 링크를 붙여넣으세요...">
        <button class="header-btn" id="youtube-load-btn">
          <span class="material-symbols-outlined">play_arrow</span>로드
        </button>
        <select id="youtube-history-select">
          <option value="">최근 영상...</option>
        </select>
      </div>
    </div>
  </div>

  <!-- Right Section: Anki Connect Status -->
  <div class="header-right">
    <button class="header-btn" id="anki-status-btn" title="Anki를 실행하거나 상태를 확인합니다">
      <div class="status-dot" id="anki-status-dot"></div>
      <span class="material-symbols-outlined">sync</span>
      <span>Anki 연결</span>
    </button>
  </div>
</header>

<!-- ============ Main Content ============ -->
<main>

  <!-- Left Panel: Video Player & Controls -->
  <section class="video-section">

    <!-- Video Container -->
    <div class="video-container">
      <video id="video-element" playsinline></video>
      <div id="youtube-player" style="display: none; width: 100%; height: 100%;"></div>
      <div id="no-video-msg">에피소드를 선택하면 영상이 재생됩니다</div>

      <!-- Subtitle Overlays -->
      <div class="subtitle-overlay-box">
        <div class="overlay-text english" id="overlay-en" style="display: none;"></div>
        <div class="overlay-text korean" id="overlay-kr" style="display: none;"></div>
      </div>
    </div>

    <!-- Player Controls -->
    <div class="player-controls">
      <!-- Progress label -->
      <div style="display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: var(--text-muted); font-weight: 500;">
        <span>대사 진행률</span>
        <span id="progress-text">0 / 0 (0%)</span>
      </div>

      <div style="display: flex; align-items: center; width: 100%; gap: 12px;">
        <!-- Playback buttons -->
        <div class="control-group">
          <button class="btn" id="play-btn" title="재생 / 일시정지 (Space)">
            <svg id="play-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"></path></svg>
            <svg id="pause-icon" viewBox="0 0 24 24" style="display: none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"></path></svg>
          </button>
          <button class="btn" id="prev-btn" title="이전 대사 (←)">
            <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"></path></svg>
          </button>
          <button class="btn" id="next-btn" title="다음 대사 (→)">
            <svg viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"></path></svg>
          </button>
        </div>

        <!-- A-B Loop -->
        <div class="control-group">
          <button class="btn" id="ab-loop-btn" title="현재 대사 구간 반복 토글 (R)">
            <svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"></path></svg>
            <span>구간 반복</span>
          </button>
        </div>

        <!-- Progress Bar -->
        <div id="progress-bar-container">
          <div>
            <div id="progress-bar-fill"></div>
          </div>
        </div>

        <!-- Speed Control -->
        <div class="control-group" style="gap: 4px;">
          <span style="font-size: 11px; color: var(--text-muted); font-weight: 500;">속도</span>
          <input id="speed-slider" type="range" min="0.5" max="2.0" step="0.1" value="1.0" style="width: 44px;">
          <span id="speed-indicator" style="min-width: 30px; text-align: right; font-size: 11px; color: var(--text-secondary);">1.0x</span>
        </div>
      </div>
    </div>

  </section>

  <!-- Right Panel: Sidebar with 4 Modes -->
  <aside class="sidebar">

    <!-- Mode Selection Tabs -->
    <div class="sidebar-tabs">
      <button class="tab-btn active" id="mode-listening" title="기본 리스닝 및 자막 목록">
        <span class="material-symbols-outlined">headphones</span>리스닝
      </button>
      <button class="tab-btn" id="mode-dictation" title="음성 말하기 및 타이핑 채점">
        <span class="material-symbols-outlined">mic</span>말하기
      </button>
      <button class="tab-btn" id="mode-anki" title="자막 선택 후 Anki/파일 내보내기">
        <span class="material-symbols-outlined">download</span>추출
      </button>
    </div>

    <!-- Subtitle List (Visible in Mode 1, 3) -->
    <div class="tab-content active" id="content-subs" style="flex: 1; display: flex; flex-direction: column; min-height: 0;">
      <div class="subtitle-header-bar" style="display: flex; justify-content: space-between; align-items: center; padding: 6px 14px; border-bottom: 1px solid var(--border); font-size: 12px; color: var(--text-muted);">
        <span style="font-size: 12px; font-weight: 500;">자막 목록</span>
        <button id="toggle-blur-btn" class="btn" title="전체 자막 블러 토글 (단축키: V)" style="height: 26px; padding: 0 8px; font-size: 11px; gap: 4px; border-radius: var(--radius-sm); border: 1px solid var(--border); color: var(--text-muted); cursor: pointer;">
          <span class="material-symbols-outlined" id="blur-icon" style="font-size: 14px; pointer-events: none;">visibility_off</span>
          <span id="blur-btn-text" style="pointer-events: none;">자막 숨김 (V)</span>
        </button>
      </div>
      <div class="subtitle-list-container" id="subtitle-list" style="flex: 1;">
        <div style="padding: 32px 16px; text-align: center; color: var(--text-muted); font-size: 13px;">
          에피소드를 선택하면 자막 목록이 여기에 표시됩니다.
        </div>
      </div>
    </div>

    <!-- Dictation Panel (Visible in Mode 2) -->
    <div class="tab-content" id="content-dictation" style="flex: 1;">
      <div class="dictation-panel-container">
        <div class="anki-card">
          <h3>
            <span class="material-symbols-outlined">record_voice_over</span>대사 말하기 & 맞추기
          </h3>
          <div class="form-group">
            <label for="dictation-input">대사를 듣고 직접 말하거나 타이핑해보세요</label>
            <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 6px;">
              <input id="dictation-input" type="text" autocomplete="off" placeholder="타이핑하거나 음성 채점 버튼을 누르세요..." style="width: 100%; box-sizing: border-box;">
              <div style="display: flex; gap: 8px; width: 100%;">
                <button class="btn primary" id="dictation-check-btn" style="flex: 1; height: 36px; font-size: 12px; justify-content: center;">정답 확인</button>
                <button class="btn" id="stt-mic-btn" type="button" title="마이크로 말해서 쉐도잉 채점하기" style="flex: 1; height: 36px; font-size: 12px; border: 1px solid rgba(239, 68, 68, 0.3); border-radius: var(--radius-md); color: #f87171; background: rgba(239, 68, 68, 0.1); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap;">
                  <span class="material-symbols-outlined" style="font-size: 18px; pointer-events: none;">mic</span>
                  <span id="stt-mic-label" style="pointer-events: none;">음성 채점</span>
                </button>
              </div>
            </div>
          </div>
        </div>

        <!-- Dictation Result -->
        <div class="anki-card" id="dictation-result-card" style="display: none; flex-direction: column;">
          <!-- STT Score Badge -->
          <div id="stt-score-badge" style="display: none; padding: 8px 12px; border-radius: 8px; font-weight: 600; font-size: 13px; text-align: center; margin-bottom: 10px;"></div>

          <div style="display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px;">
            <h3 style="margin: 0; font-size: 14px; font-weight: 600; color: var(--text-primary); display: flex; align-items: center; gap: 6px;">
              <span class="material-symbols-outlined">search</span>결과
            </h3>
            <div style="display: flex; gap: 6px; flex-wrap: wrap;">
              <button class="btn" id="dictation-replay-btn" title="현재 대사 다시 듣기" style="height: 30px; padding: 0 10px; font-size: 11px; border: 1px solid var(--border); border-radius: var(--radius-sm);">
                <span class="material-symbols-outlined" style="font-size: 15px;">replay</span>다시 듣기
              </button>
              <button class="btn" id="dictation-star-btn" style="height: 30px; padding: 0 10px; font-size: 11px; border: 1px solid rgba(251,191,36,0.2); border-radius: var(--radius-sm); color: var(--warning); background: var(--warning-dim);">
                <span class="material-symbols-outlined" style="font-size: 15px;">star</span>보관 (A)
              </button>
              <button class="btn" id="ai-explain-btn" title="AI에게 이 문장의 뜻과 뉘앙스 물어보기" style="height: 30px; padding: 0 10px; font-size: 11px; border: 1px solid rgba(192,132,252,0.2); border-radius: var(--radius-sm); color: var(--purple); background: var(--purple-dim);">
                <span class="material-symbols-outlined" style="font-size: 15px;">auto_awesome</span>AI 설명
              </button>
            </div>
          </div>

          <div id="dictation-result-box"></div>

          <div class="form-group" style="margin-top: 12px;">
            <label>해석</label>
            <div id="dictation-translation" style="font-size: 14px; color: var(--text-secondary); line-height: 1.5;"></div>
          </div>

          <!-- AI Explanation -->
          <div id="ai-explanation-container" style="display: none;">
            <h4 style="margin: 0 0 10px 0; font-size: 13px; font-weight: 500; color: var(--purple); display: flex; align-items: center; gap: 6px;">
              <span class="material-symbols-outlined" style="font-size: 18px;">psychology</span>AI 분석
              <div id="ai-loading-spinner" style="display: none; width: 12px; height: 12px; border: 2px solid rgba(192,132,252,0.3); border-top-color: #c084fc; border-radius: 50%; animation: spin 1s linear infinite;"></div>
            </h4>
            <div id="ai-explanation-box"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Anki Extraction Panel (Visible in Mode 4) -->
    <div id="anki-extraction-panel">
      <div style="display: flex; justify-content: space-between; align-items: center; padding: 0 16px; margin-bottom: 12px; gap: 6px;">
        <h3 style="font-size: 13px; font-weight: 600; color: var(--text-primary); margin: 0; display: flex; align-items: center; gap: 4px; white-space: nowrap;">
          <span class="material-symbols-outlined" style="color: var(--warning); font-size: 16px;">star</span>
          보관 (<span id="starred-count">0</span>)
        </h3>
        <div style="display: flex; gap: 4px; align-items: center;">
          <button class="header-btn" id="export-apkg-btn" title="Anki 덱 파일(.apkg)로 다운로드" style="height: 28px; padding: 0 8px; font-size: 11px; cursor: pointer;">
            <span class="material-symbols-outlined" style="font-size: 14px; pointer-events: none;">download</span>.apkg
          </button>
          <button class="header-btn" id="export-csv-btn" title="Excel/CSV 파일(.csv)로 다운로드" style="height: 28px; padding: 0 8px; font-size: 11px; cursor: pointer;">
            <span class="material-symbols-outlined" style="font-size: 14px; pointer-events: none;">table_chart</span>.csv
          </button>
          <button class="btn primary" id="anki-bulk-export-btn" title="Anki 앱으로 직접 전송" style="height: 28px; padding: 0 10px; font-size: 11px; border-radius: var(--radius-md); white-space: nowrap;">
            <span class="material-symbols-outlined" style="font-size: 14px; pointer-events: none;">rocket_launch</span>Anki 전송
          </button>
        </div>
      </div>

      <div id="starred-list-container">
        <div style="text-align: center; color: var(--text-muted); margin-top: 40px; font-size: 13px;">
          보관된 문장이 없습니다.<br>맞추기 모드에서 '⭐ 보관 (A)' 버튼을 눌러 문장을 모아보세요.
        </div>
      </div>

      <div id="bulk-export-progress" style="display: none;">
        <div id="bulk-export-status" style="font-size: 13px; color: var(--text-secondary);">전송 중... (0/0)</div>
      </div>
    </div>

  </aside>
</main>

<!-- YouTube IFrame API -->
<script>
    var tag = document.createElement('script');
    tag.src = 'https://www.youtube.com/iframe_api';
    var firstScriptTag = document.getElementsByTagName('script')[0];
    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
    
    window.onYouTubeIframeAPIReady = function() {
      console.log('YouTube IFrame API Ready');
      window._ytAPIReady = true;
    };
</script>
<!-- Load App scripts -->
<script type="module" src="/js/app.js?v=20260816_2051"></script>
</body>
</html>
