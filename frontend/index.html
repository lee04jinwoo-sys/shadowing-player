<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <script>
      (function () {
        var t = 'dark';
        try {
          var saved = localStorage.getItem('shadowing_theme');
          if (saved === 'light' || saved === 'dark') {
            t = saved;
          }
        } catch (e) {}
        document.documentElement.dataset.theme = t;
      })();
    </script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230a0d14'/%3E%3Crect x='2' y='2' width='28' height='28' rx='6' fill='none' stroke='%238b93ff' stroke-opacity='.45' stroke-width='1.5'/%3E%3Cpath d='M8 12h16v8H8z' fill='none' stroke='%238b93ff' stroke-width='2' stroke-linejoin='round'/%3E%3Cpath d='M11 16h4m2 0h4' stroke='%23eef1f6' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <title>Shadowing Player</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function () {
        if (!window.YT) {
          var tag = document.createElement('script');
          tag.src = 'https://www.youtube.com/iframe_api';
          var firstScriptTag = document.getElementsByTagName('script')[0];
          if (firstScriptTag && firstScriptTag.parentNode) {
            firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
          }
        }
        window.onYouTubeIframeAPIReady = function () {
          window._ytAPIReady = true;
          window.dispatchEvent(new Event('yt-iframe-api-ready'));
        };
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
